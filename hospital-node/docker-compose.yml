# MedVault – G3 Demo Stack
# MongoDB 3-node Sharded Cluster replica set + Mongo Express
# Simulates federated clinical research platform (GDPR/HIPAA context)
include:
  - ./../docker-compose.base.yml

# define common MongoDB template
x-mongo-base: &mongo-base
  image: mongo:7.0
  restart: unless-stopped
  networks:
    - net-internal
  deploy:
    resources:
      limits:
        memory: 1g  # limit the container to use at most 1GB of memory
      reservations:
        memory: 512m # reserve 512MB for the container
services:

  # ── Config servers (CSRS) ─────────────────────────────────────────────────
  configsvr1:
    <<: *mongo-base
    container_name: hospital-node-configsvr1
    command: ["mongod", "--configsvr", "--replSet", "csrs", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "27019:27019" # Config Server default Port
    volumes:
      - configsvr1-data:/data/db        
      - configsvr1-config:/data/configdb
  configsvr2:
    <<: *mongo-base
    container_name: hospital-node-configsvr2
    command: ["mongod", "--configsvr", "--replSet", "csrs", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "28019:27019" # Avoid host-port clash with configsvr1
    volumes:
      - configsvr2-data:/data/db        
      - configsvr2-config:/data/configdb
  configsvr3:
    <<: *mongo-base
    container_name: hospital-node-configsvr3
    command: ["mongod", "--configsvr", "--replSet", "csrs", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "29019:27019" # Avoid host-port clash with configsvr1
    volumes:
      - configsvr3-data:/data/db        
      - configsvr3-config:/data/configdb

# ── 2. Shard 1 (include A, B and C nodes, show Replication) ────────────────────
  # Mongo node A
  shard1a:
    <<: *mongo-base
    container_name: hospital-node-shard1a
    command: ["mongod", "--shardsvr", "--replSet", "sh1rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - shard1a-data:/data/db        
      - shard1a-config:/data/configdb
  # Mongo node B
  shard1b:
    <<: *mongo-base
    container_name: hospital-node-shard1b
    command: ["mongod", "--shardsvr", "--replSet", "sh1rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - shard1b-data:/data/db        
      - shard1b-config:/data/configdb
  # Mongo node C
  shard1c:
    <<: *mongo-base
    container_name: hospital-node-shard1c
    command: ["mongod", "--shardsvr", "--replSet", "sh1rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - shard1c-data:/data/db        
      - shard1c-config:/data/configdb

# ── 3. Shard 2 (single node, show horizontal scaling) ────────────────────
  shard2:
    <<: *mongo-base
    container_name: hospital-node-shard2
    command: ["mongod", "--shardsvr", "--replSet", "sh2rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - shard2-data:/data/db        
      - shard2-config:/data/configdb

# ── 4. Mongos (query router - the only entry point of the system) ──────────
  mongos-router:
    <<: *mongo-base
    container_name: hospital-node-router
    command: ["mongos", "--configdb", "csrs/configsvr1:27019,configsvr2:27019,configsvr3:27019", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      configsvr1:
        condition: service_healthy
      configsvr2:
        condition: service_healthy
      configsvr3:
        condition: service_healthy

  # ── Mongo Express (web UI) ────────────────────────────────────────────────
  # Connects to the replica set via the router.
  # ME_CONFIG_MONGODB_URL must use the replica set name for proper failover.
  mongo-express:
    image: mongo-express:1.0.2           # pin version – never :latest
    container_name: medvault-express
    ports:
      - "8081:8081"                      # http://localhost:8081
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongos-router:27017/" # link to the mongos-router container, router handles the routing to the appropriate shard
      ME_CONFIG_BASICAUTH_USERNAME: "${BASICAUTH_USERNAME}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${BASICAUTH_PASSWORD}"
      ME_CONFIG_OPTIONS_EDITORTHEME: "ambiance"
    depends_on:
      mongos-router:
        condition: service_healthy
    networks:
      - net-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
# ── Cluster initialization ───────────────────────────────────────────────────────
  init-shards-cluster:
    <<: *mongo-base
    container_name: hospital-node-init
    networks:
      - net-internal
    volumes:
      - ./../scripts/init-hospital-shards.sh:/init-shards.sh:ro
    entrypoint: ["/bin/bash", "/init-shards.sh"]
    restart: "no"
    depends_on:
      configsvr1:
        condition: service_started
      configsvr2:
        condition: service_started
      configsvr3:
        condition: service_started
      shard1a:
        condition: service_started
      shard1b:
        condition: service_started
      shard1c:
        condition: service_started
      shard2:
        condition: service_started
      mongos-router:
        condition: service_started
# Agent API
  agent-api:
    # Mock-only container: serves as the ONLY federated-reachable endpoint for this stack.
    # It can still reach the internal Mongo cluster via `net-internal`, but the only
    # network exposed across stacks is the shared `net-federated-bridge` boundary.
    image: python:3.12-alpine
    container_name: agent-api
    networks:
      - net-internal
      - net-federated-bridge
    expose:
      - "9000"
    command: ["python", "-m", "http.server", "9000"]
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────────
# One pair per node. Data persists across `docker-compose down`.
# Use `docker-compose down -v` to wipe everything (demo reset).
volumes:
  configsvr1-data:
  configsvr1-config:
  configsvr2-data:
  configsvr2-config:
  configsvr3-data:
  configsvr3-config:
  shard1a-data:
  shard1a-config:
  shard1b-data:
  shard1b-config:
  shard1c-data:
  shard1c-config:
  shard2-data:
  shard2-config:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  net-internal:
    driver: bridge
