version: "3.8"

# MedVault – G3 Demo Stack
# MongoDB 3-node replica set + Mongo Express
# Simulates federated clinical research platform (GDPR/HIPAA context)

services:

  # ── Replica set initialiser ───────────────────────────────────────────────
  # One-shot container: waits for all three mongod nodes to accept connections,
  # then calls rs.initiate(). Exits 0 on success; Docker marks it "exited".
  mongo-init:
    image: mongo:7.0
    container_name: medvault-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - medvault-net
    restart: "no"
    entrypoint: >
      mongosh --host mongo1:27017 --eval "
        try {
          rs.initiate({
            _id: 'medvault-rs',
            members: [
              { _id: 0, host: 'mongo1:27017', priority: 2 },
              { _id: 1, host: 'mongo2:27017', priority: 1 },
              { _id: 2, host: 'mongo3:27017', priority: 1 }
            ]
          });
        } catch(e) {
          if (e.codeName !== 'AlreadyInitialized') { throw e; }
            print('Replica set already initialized, continuing...');
          }
          var deadline = new Date().getTime() + 60000;
          while (rs.status().myState !== 1) {
            if (new Date().getTime() > deadline) { quit(1); }
            sleep(500);
          }
          print('Primary elected: ' + rs.status().members.filter(m => m.stateStr === 'PRIMARY')[0].name);
        "

  # ── Mongo node 1 (preferred primary) ─────────────────────────────────────
  mongo1:
    image: mongo:7.0
    container_name: medvault-mongo1
    hostname: mongo1                     # hostname must match rs member host
    command: ["mongod", "--replSet", "medvault-rs", "--bind_ip_all"]
    ports:
      - "27017:27017"                    # expose for mongosh access from host
    volumes:
      - mongo1-data:/data/db            # named volume: survives docker-compose down
      - mongo1-config:/data/configdb
    networks:
      - medvault-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s                  # give mongod time to start before first probe

  # ── Mongo node 2 ──────────────────────────────────────────────────────────
  mongo2:
    image: mongo:7.0
    container_name: medvault-mongo2
    hostname: mongo2
    command: ["mongod", "--replSet", "medvault-rs", "--bind_ip_all"]
    volumes:
      - mongo2-data:/data/db
      - mongo2-config:/data/configdb
    networks:
      - medvault-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Mongo node 3 ──────────────────────────────────────────────────────────
  mongo3:
    image: mongo:7.0
    container_name: medvault-mongo3
    hostname: mongo3
    command: ["mongod", "--replSet", "medvault-rs", "--bind_ip_all"]
    volumes:
      - mongo3-data:/data/db
      - mongo3-config:/data/configdb
    networks:
      - medvault-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Mongo Express (web UI) ────────────────────────────────────────────────
  # Connects to the replica set via the primary (mongo1).
  # ME_CONFIG_MONGODB_URL must use the replica set name for proper failover.
  mongo-express:
    image: mongo-express:1.0.2           # pin version – never :latest
    container_name: medvault-express
    ports:
      - "8081:8081"                      # http://localhost:8081
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=medvault-rs"
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD: "medvault2026"
      ME_CONFIG_OPTIONS_EDITORTHEME: "ambiance"
    depends_on:
      mongo-init:
        condition: service_completed_successfully   # only start after rs.initiate() succeeds
    networks:
      - medvault-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://admin:medvault2024@localhost:8081"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

# ── Named volumes ─────────────────────────────────────────────────────────────
# One pair per node. Data persists across `docker-compose down`.
# Use `docker-compose down -v` to wipe everything (demo reset).
volumes:
  mongo1-data:
  mongo1-config:
  mongo2-data:
  mongo2-config:
  mongo3-data:
  mongo3-config:

# ── Network ───────────────────────────────────────────────────────────────────
# Bridge network: services reach each other by container hostname (mongo1, mongo2…).
# Replica set member host strings in rs.initiate() MUST match these hostnames.
networks:
  medvault-net:
    driver: bridge
