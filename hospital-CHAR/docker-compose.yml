# Stack: hospital-CHAR — same topology as AMC (simplified shard demo).
# Prerequisites: ./scripts/init-federated-network.sh

include:
  - ../docker-compose.base.yml

x-mongo-base: &mongo-base
  image: mongo:${MONGO_VERSION}
  restart: unless-stopped
  env_file:
    - ./.env
    - ./../.shared.env
  deploy:
    resources:
      limits:
        memory: 512m
      reservations:
        memory: 128m

x-mongo-tpl: &mongo-tpl
  <<: *mongo-base
  networks:
    - net-internal

x-configsvr-tpl: &configsvr-tpl
  <<: *mongo-tpl
  command: ["mongod", "--configsvr", "--replSet", "csrs", "--bind_ip_all", "--port", "27019"]
  healthcheck:
    test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping').ok", "--quiet"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s
  ports:
    - "27019"

x-shard-tpl: &shard-tpl
  <<: *mongo-tpl
  command: ["mongod", "--shardsvr", "--replSet", "sh1rs", "--bind_ip_all"]
  healthcheck:
    test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping').ok", "--quiet"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 15s
  ports:
    - "27019"

services:

  configsvr1:
    <<: *configsvr-tpl
    container_name: hospital-CHAR-configsvr1
    volumes:
      - configsvr1-data:/data/db
      - configsvr1-config:/data/configdb

  shard1:
    <<: *shard-tpl
    container_name: hospital-CHAR-shard1
    volumes:
      - shard1-data:/data/db
      - shard1-config:/data/configdb

  shard2:
    <<: *shard-tpl
    container_name: hospital-CHAR-shard2
    command: ["mongod", "--shardsvr", "--replSet", "sh2rs", "--bind_ip_all"]
    volumes:
      - shard2-data:/data/db
      - shard2-config:/data/configdb

  init-replica-sets:
    <<: *mongo-base
    container_name: hospital-CHAR-init-rs
    networks:
      - net-internal
    volumes:
      - ../scripts/init-replica-sets-shard-demo.sh:/init-replica-sets.sh:ro
    entrypoint: ["/bin/bash", "/init-replica-sets.sh"]
    restart: "no"
    depends_on:
      configsvr1:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy

  init-shards-cluster:
    <<: *mongo-base
    container_name: hospital-CHAR-init-shards
    networks:
      - net-internal
    volumes:
      - ../scripts/init-simple-hospital-shards.sh:/init-shards.sh:ro
    entrypoint: ["/bin/bash", "/init-shards.sh"]
    restart: "no"
    depends_on:
      mongos-router:
        condition: service_healthy

  mongos-router:
    <<: *mongo-base
    container_name: hospital-CHAR-router
    command: ["mongos", "--configdb", "csrs/configsvr1:27019", "--bind_ip_all"]
    ports:
      - "${MONGOS_HOST_PORT:-27317}:27017"
    networks:
      - net-internal
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      init-replica-sets:
        condition: service_completed_successfully
      configsvr1:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy

  # mongo-express:
  #   image: mongo-express:${MONGO_EXPRESS_VERSION}
  #   restart: unless-stopped
  #   container_name: hospital-CHAR-express
  #   ports:
  #     - "${UI_PORT:-8083}:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_URL: "mongodb://mongos-router:27017/"
  #     ME_CONFIG_BASICAUTH_USERNAME: "${BASICAUTH_USERNAME}"
  #     ME_CONFIG_BASICAUTH_PASSWORD: "${BASICAUTH_PASSWORD}"
  #     ME_CONFIG_OPTIONS_EDITORTHEME: "ambiance"
  #   depends_on:
  #     mongos-router:
  #       condition: service_healthy
  #   networks:
  #     - net-internal

  agent-char:
    build: ../agents/agent_api
    container_name: agent-char
    environment:
      - HOSPITAL_CODE=CHAR
    networks:
      - net-internal
      - net-federated-bridge
    ports:
      - "9003:9000"
    env_file:
      - ./.env
      - ./../.shared.env

volumes:
  configsvr1-data:
  configsvr1-config:
  shard1-data:
  shard1-config:
  shard2-data:
  shard2-config:

networks:
  net-internal:
    driver: bridge
